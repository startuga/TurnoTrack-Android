name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK (release, assinado)
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk TurnoTrack.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TurnoTrack-build-${{ github.run_number }}
          path: TurnoTrack.apk

      - name: Guardar relatórios de testes (se falharem)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: app/build/reports/

      # Cada push para main atualiza a release "latest", para haver sempre o mesmo link:
      # https://github.com/<dono>/<repo>/releases/latest/download/TurnoTrack.apk
      - name: Publicar na release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TurnoTrack.apk \
            --target "${{ github.sha }}" \
            --title "TurnoTrack — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir de ${{ github.sha }}. Instala por cima da versão anterior; os teus registos mantêm-se."
